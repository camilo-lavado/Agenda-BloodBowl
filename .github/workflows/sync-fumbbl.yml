name: Sync FUMBBL

# DESACTIVADO el disparo automático (schedule): FUMBBL bloquea a nivel de red
# las conexiones desde los runners de GitHub Actions (IP de datacenter) —
# confirmado con net::ERR_TIMED_OUT en varias corridas, no es un tema de
# tiempo de espera. La sincronización real corre ahora como tarea programada
# en un computador normal (ver automation/run-sync.ps1 y el README). Este
# workflow se deja con workflow_dispatch por si algún día se agrega un
# runner "self-hosted" (con runs-on: self-hosted) desde una IP que sí pase.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-fumbbl
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Los secrets están guardados en el entorno "Production"
    # (Settings -> Environments / Secrets and variables -> Actions).
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del sincronizador
        working-directory: automation
        run: npm install

      - name: Instalar Chromium (Playwright)
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Leer FUMBBL y actualizar Supabase / schedule.ts
        working-directory: automation
        timeout-minutes: 12
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run sync

      - name: Subir capturas de diagnóstico (si falló al pasar Anubis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-anubis
          path: |
            automation/debug-anubis.png
            automation/debug-anubis.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit si hay una ronda nueva
        run: |
          if git diff --quiet -- src/data/schedule.ts; then
            echo "Sin cambios en schedule.ts"
            exit 0
          fi
          git config user.name "fumbbl-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/schedule.ts
          git commit -m "Sync automático FUMBBL: nueva ronda"
          git push
